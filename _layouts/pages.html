---
layout: default
---

<article class="page-shell container">
  <header class="page-intro">
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-intro__summary">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="page-surface prose">
    {{ content }}
  </div>
</article>
