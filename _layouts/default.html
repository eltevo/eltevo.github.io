<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050910">
    <meta name="color-scheme" content="dark">

    {% seo %}

    {% if page.thumbnail.src %}
      <meta property="og:image" content="{{ page.thumbnail.src | absolute_url }}">
      <meta name="twitter:card" content="summary_large_image">
    {% endif %}

    <link rel="icon" href="{{ '/assets/images/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/source-sans-3/source-sans-3-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/source-serif-4/source-serif-4-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <script>document.documentElement.classList.add('js');</script>
    {% if page.math %}
      <script src="{{ '/assets/js/mathjax/mathjax-config.js' | relative_url }}" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
    {% endif %}
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}

    <main id="main-content" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.zoom %}
      <script src="{{ '/assets/js/zoom.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
